spring.datasource.url=jdbc:h2:mem:talentbridge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
recordatorio-publicacion.enabled=false
content.moderation.enabled=false
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.from=noreply@talentbridge.test
spring.mail.from-name=TalentBridge Test
spring.mail.provider=smtp
brevo.api-key=
brevo.api-url=https://api.brevo.com/v3/smtp/email
